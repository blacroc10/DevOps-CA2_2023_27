name: truthgraph-ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test
        working-directory: service
        run: |
          python -m pip install -r requirements.txt
          pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/truthgraph-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/truthgraph-api:latest

  deploy:
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: truthgraph-ci
          node_image: kindest/node:v1.37.0
          kubectl_version: v1.37.1
          wait: 120s
      - name: Pull images and load them into kind
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/truthgraph-api:${{ github.sha }}"
          docker pull "$src"
          docker tag "$src" truthgraph-api:v1
          kind load docker-image truthgraph-api:v1 --name truthgraph-ci
          docker pull neo4j:5-community
          # kind load rejects this multi-arch index (missing attestation digest).
          docker save neo4j:5-community | docker exec -i truthgraph-ci-control-plane ctr --namespace=k8s.io images import -
      - name: Apply manifests and smoke-test
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/neo4j.yaml
          kubectl apply -f k8s/api.yaml
          kubectl -n truthgraph rollout status deployment/neo4j --timeout=240s
          kubectl -n truthgraph rollout status deployment/api --timeout=240s
          kubectl -n truthgraph exec deploy/api -- python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode()); print(urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=5).read().decode().splitlines()[0])"
      - name: Roll back and fail the job
        if: failure()
        run: |
          kubectl -n truthgraph rollout undo deployment/api || true
          kubectl -n truthgraph get pods -o wide || true
          exit 1
