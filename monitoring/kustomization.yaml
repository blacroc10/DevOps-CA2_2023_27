apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      grafana_dashboard: "1"
    includeSelectors: false
configMapGenerator:
  - name: truthgraph-dashboard
    files:
      - truthgraph-overview.json=grafana/truthgraph-overview.json
    options:
      disableNameSuffixHash: true
